<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Эвелина Врублевская</title>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --neon:#b700ff;--neon2:#ff00ff;--violet:#7c3aed;
      --bg:#07000f;--card:rgba(14,0,28,.85)
    }
    body{
      min-height:100vh;background:var(--bg);
      display:flex;align-items:center;justify-content:center;
      font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
      overflow:hidden;position:relative
    }

    /* ── MLM SVG Background ── */
    .bg-mlm{
      position:fixed;inset:0;z-index:0;pointer-events:none;
      overflow:hidden
    }
    .bg-mlm svg{width:100%;height:100%;object-fit:cover}

    /* ── Dot grid overlay ── */
    body::before{
      content:'';position:fixed;inset:0;
      background-image:radial-gradient(circle,rgba(183,0,255,.12) 1px,transparent 0);
      background-size:36px 36px;pointer-events:none;z-index:1
    }

    /* ── Particles ── */
    #particles{position:fixed;inset:0;pointer-events:none;z-index:2}
    .p{
      position:absolute;border-radius:50%;
      animation:rise linear infinite;opacity:0
    }
    @keyframes rise{
      0%{transform:translateY(100vh) scale(0);opacity:0}
      8%{opacity:1}90%{opacity:.8}
      100%{transform:translateY(-60px) scale(1);opacity:0}
    }

    /* ── Card ── */
    .card{
      position:relative;z-index:3;
      background:var(--card);
      border:1px solid rgba(183,0,255,.32);
      border-radius:28px;
      padding:52px 44px 44px;
      max-width:440px;width:92%;
      text-align:center;
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.05) inset,
        0 0 60px rgba(183,0,255,.25),
        0 0 120px rgba(183,0,255,.1);
      animation:appear .8s cubic-bezier(.22,1,.36,1) both;
      will-change:transform;
      transition:transform .12s ease-out
    }
    @keyframes appear{
      from{opacity:0;transform:translateY(36px) scale(.96)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }

    /* ── Avatar 220px ── */
    .avatar-wrap{
      position:relative;width:220px;height:220px;
      margin:0 auto 28px
    }
    .avatar-ring{
      position:absolute;inset:-5px;border-radius:50%;
      background:conic-gradient(#b700ff,#ff00ff,#a855f7,#7c3aed,#b700ff);
      animation:spin 4s linear infinite;z-index:0
    }
    .avatar-ring::after{
      content:'';position:absolute;inset:3px;
      border-radius:50%;background:var(--bg)
    }
    .avatar-glow{
      position:absolute;inset:-14px;border-radius:50%;
      background:conic-gradient(#b700ff,#ff00ff,#7c3aed,#b700ff);
      filter:blur(18px);opacity:.55;
      animation:spin 4s linear infinite;z-index:-1
    }
    .avatar{
      position:relative;z-index:1;
      width:220px;height:220px;border-radius:50%;
      overflow:hidden;
      background:linear-gradient(135deg,#200040,#4a0080,#7c3aed)
    }
    .avatar img{
      width:100%;height:100%;
      object-fit:cover;object-position:center top;
      display:block
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Name ── */
    .name{
      font-size:clamp(22px,5.5vw,30px);font-weight:900;
      line-height:1.2;letter-spacing:-.3px;margin-bottom:10px;
      background:linear-gradient(110deg,#ff66ff,#cc00ff,#a855f7,#ff66ff);
      background-size:220% auto;
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;
      animation:gshift 4s linear infinite;
      filter:drop-shadow(0 0 18px rgba(183,0,255,.55))
    }
    @keyframes gshift{
      0%{background-position:0% center}
      100%{background-position:220% center}
    }

    /* ── Badge ── */
    .badge{
      display:inline-flex;align-items:center;gap:6px;
      padding:5px 14px;border-radius:40px;
      border:1px solid rgba(183,0,255,.45);
      background:rgba(183,0,255,.1);
      font-size:11.5px;font-weight:600;letter-spacing:1.2px;
      text-transform:uppercase;color:#d48bff;
      margin-bottom:16px;
      animation:bpulse 3s ease-in-out infinite
    }
    .badge svg{width:14px;height:14px;fill:#b700ff}
    @keyframes bpulse{
      0%,100%{box-shadow:0 0 0 0 rgba(183,0,255,.0)}
      50%{box-shadow:0 0 12px 2px rgba(183,0,255,.25)}
    }

    /* ── Spec ── */
    .spec{
      font-size:14.5px;line-height:1.6;
      color:rgba(210,160,255,.85);margin-bottom:28px;letter-spacing:.2px
    }

    /* ── Divider ── */
    .divider{
      height:1px;
      background:linear-gradient(90deg,transparent,rgba(183,0,255,.5) 40%,rgba(255,0,255,.4) 60%,transparent);
      margin:4px 0 26px
    }

    /* ── Socials ── */
    .socials{display:flex;justify-content:center;gap:14px;margin-bottom:26px}
    .soc{
      display:flex;align-items:center;justify-content:center;
      width:56px;height:56px;border-radius:18px;
      text-decoration:none;position:relative;
      transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease
    }
    .soc svg{width:28px;height:28px;transition:transform .3s ease}
    .soc-tg{background:rgba(42,171,238,.12);border:1px solid rgba(42,171,238,.3)}
    .soc-tg svg{fill:#2AABEE}
    .soc-tg:hover{
      transform:translateY(-8px) scale(1.12);
      box-shadow:0 12px 30px rgba(42,171,238,.45);
      background:rgba(42,171,238,.25);border-color:#2AABEE
    }
    .soc-tg:hover svg{transform:scale(1.12)}
    .soc::after{
      content:attr(data-tip);position:absolute;bottom:-26px;
      left:50%;transform:translateX(-50%);
      font-size:10.5px;color:rgba(210,160,255,.7);
      white-space:nowrap;opacity:0;transition:opacity .2s ease;pointer-events:none
    }
    .soc:hover::after{opacity:1}

    /* ── CTA Button ── */
    .btn{
      display:flex;align-items:center;justify-content:center;gap:10px;
      width:100%;padding:17px 28px;border-radius:16px;
      background:linear-gradient(135deg,#9500cc,#b700ff,#7c3aed);
      background-size:200% auto;border:none;
      color:#fff;font-size:15.5px;font-weight:700;
      letter-spacing:.4px;text-decoration:none;cursor:pointer;
      position:relative;overflow:hidden;
      transition:transform .3s ease,box-shadow .3s ease,background-position .5s ease;
      animation:btnp 2.8s ease-in-out infinite
    }
    .btn:hover{
      transform:translateY(-3px);background-position:right center;
      box-shadow:0 10px 35px rgba(183,0,255,.65);animation:none
    }
    .btn:active{transform:translateY(-1px)}
    .btn::after{
      content:'';position:absolute;top:-50%;left:-80%;
      width:50%;height:200%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
      transform:skewX(-20deg);animation:shine 3.5s ease-in-out infinite
    }
    @keyframes shine{0%{left:-80%}60%{left:120%}100%{left:120%}}
    @keyframes btnp{
      0%,100%{box-shadow:0 4px 22px rgba(183,0,255,.35),0 0 0 0 rgba(183,0,255,.25)}
      50%{box-shadow:0 4px 22px rgba(183,0,255,.35),0 0 0 9px rgba(183,0,255,.0)}
    }
    .btn svg{width:20px;height:20px;fill:#fff;flex-shrink:0;position:relative;z-index:1}
    .btn span{position:relative;z-index:1}

    /* ── Footer ── */
    .footer{margin-top:22px;font-size:11px;color:rgba(183,0,255,.35);letter-spacing:.5px}

    /* ── Responsive ── */
    @media(max-width:480px){
      .card{padding:36px 22px 32px}
      .avatar-wrap,.avatar{width:160px;height:160px}
    }
    @media(max-height:700px){
      .avatar-wrap,.avatar{width:140px;height:140px}
      .card{padding:28px 32px}
    }
  </style>
</head>
<body>

<!-- ── MLM Network Background SVG ── -->
<div class="bg-mlm">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0035"/>
      <stop offset="100%" stop-color="#07000f"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b700ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#b700ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff00ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nodeGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="nodeDim" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <style>
      .node-pulse{animation:nodePulse 3s ease-in-out infinite}
      .node-pulse2{animation:nodePulse 3s ease-in-out infinite 1s}
      .node-pulse3{animation:nodePulse 3s ease-in-out infinite 2s}
      .line-flow{animation:lineFlow 4s linear infinite}
      .float1{animation:floatEl 6s ease-in-out infinite}
      .float2{animation:floatEl 8s ease-in-out infinite 2s}
      .float3{animation:floatEl 7s ease-in-out infinite 4s}
      .rotate-slow{animation:rotateSlow 20s linear infinite}
      .data-dot{animation:dataDot 3s linear infinite}
      @keyframes nodePulse{
        0%,100%{r:18;opacity:.9}
        50%{r:22;opacity:1}
      }
      @keyframes lineFlow{
        0%{stroke-dashoffset:200}
        100%{stroke-dashoffset:0}
      }
      @keyframes floatEl{
        0%,100%{transform:translateY(0)}
        50%{transform:translateY(-12px)}
      }
      @keyframes rotateSlow{
        from{transform-origin:center center;transform:rotate(0deg)}
        to{transform-origin:center center;transform:rotate(360deg)}
      }
      @keyframes dataDot{
        0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}
      }
    </style>
  </defs>

  <!-- Base background -->
  <rect width="1400" height="900" fill="url(#bgGrad)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="200" cy="150" rx="280" ry="200" fill="#6600cc" opacity=".18" filter="url(#soft)"/>
  <ellipse cx="1200" cy="750" rx="300" ry="220" fill="#9900ff" opacity=".16" filter="url(#soft)"/>
  <ellipse cx="1100" cy="200" rx="200" ry="160" fill="#cc00ff" opacity=".12" filter="url(#soft)"/>
  <ellipse cx="300" cy="700" rx="220" ry="160" fill="#7c3aed" opacity=".14" filter="url(#soft)"/>

  <!-- Hex grid (subtle) -->
  <g opacity=".08" stroke="#b700ff" stroke-width="1" fill="none">
    <!-- Row 1 -->

  <!-- ═══ NETWORK CONNECTIONS ═══ -->

    <line x1="538" y1="540" x2="360" y2="640"/>
    <line x1="538" y1="540" x2="360" y2="460"/>
    <!-- from top-left -->
    <line x1="538" y1="360" x2="360" y2="460"/>
    <line x1="538" y1="360" x2="560" y2="140"/>
  </g>

  <!-- ═══ OUTER (L2) NODES ═══ -->
  <!-- Glow halos -->
  <g opacity=".35" filter="url(#glow2)">
    <circle cx="560" cy="140" r="22" fill="#a855f7"/>
    <circle cx="840" cy="140" r="22" fill="#a855f7"/>
    <circle cx="1010" cy="260" r="20" fill="#a855f7"/>
    <circle cx="1040" cy="450" r="20" fill="#a855f7"/>
    <circle cx="990" cy="660" r="20" fill="#a855f7"/>

  <!-- Node bodies -->
  <g filter="url(#glow)">
    <circle cx="560" cy="140" r="18" fill="url(#nodeDim)" stroke="#a855f7" stroke-width="1.5"/>

    <circle cx="360" cy="636" r="5"/><path d="M351,648 Q360,643 369,648 L370,654 L350,654Z"/>

  <!-- ═══ L1 NODES (medium) ═══ -->
  <g opacity=".5" filter="url(#glow2)">
    <circle cx="700" cy="270" r="28" fill="#b700ff"/>
    <circle cx="862" cy="360" r="28" fill="#b700ff"/>

  <!-- Person icons L1 -->
  <g fill="white" opacity=".9">
    <circle cx="700" cy="265" r="7"/><path d="M687,282 Q700,276 713,282 L715,291 L685,291Z"/>
    <circle cx="862" cy="355" r="7"/><path d="M849,372 Q862,366 875,372 L877,381 L847,381Z"/>

    <circle cx="700" cy="625" r="7"/><path d="M687,642 Q700,636 713,642 L715,651 L685,651Z"/>
    <circle cx="538" cy="535" r="7"/><path d="M525,552 Q538,546 551,552 L553,561 L523,561Z"/>
    <circle cx="538" cy="355" r="7"/><path d="M525,372 Q538,366 551,372 L553,381 L523,381Z"/>

  <!-- ═══ CENTER NODE ═══ -->
  <!-- Big glow halo -->
  <circle cx="700" cy="450" r="80" fill="#b700ff" opacity=".2" filter="url(#soft)"/>
  <circle cx="700" cy="450" r="55" fill="#b700ff" opacity=".25" filter="url(#glow2)"/>
  <!-- Outer ring animated -->
  <circle cx="700" cy="450" r="46" fill="none" stroke="#ff00ff" stroke-width="2" opacity=".6" stroke-dasharray="10 6" class="rotate-slow"/>
  <!-- Main circle -->
  <circle cx="700" cy="450" r="38" fill="url(#nodeGrad)" stroke="#ff00ff" stroke-width="3" filter="url(#glow)"/>
  <!-- AI chip icon in center -->
  <g transform="translate(686,436)" fill="white" opacity=".95">
    <rect x="0" y="4" width="28" height="20" rx="3" fill="none" stroke="white" stroke-width="1.8"/>
    <rect x="5" y="8" width="18" height="12" rx="1.5" fill="white" opacity=".3"/>

<script>
  /* Particles */
  const pc = document.getElementById('particles');
  const cl = ['rgba(183,0,255,.75)','rgba(255,0,255,.55)','rgba(168,85,247,.65)','rgba(232,121,249,.5)'];
  for(let i=0;i<38;i++){
    const e=document.createElement('div');e.className='p';
    const s=Math.random()*4.5+1.5;
    e.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;`+
      `background:${cl[Math.floor(Math.random()*cl.length)]};`+
      `animation-duration:${Math.random()*12+7}s;`+
      `animation-delay:${Math.random()*12}s;`+
      `box-shadow:0 0 ${s*2}px ${cl[Math.floor(Math.random()*cl.length)]};`;
    pc.appendChild(e);
  }
  /* 3D parallax */
  const card=document.getElementById('card');
  let touch=false;
  window.addEventListener('touchstart',()=>{touch=true},{once:true});
  document.addEventListener('mousemove',e=>{
    if(touch)return;
    const cx=e.clientX/innerWidth-.5,cy=e.clientY/innerHeight-.5;
    card.style.transform=`perspective(900px) rotateY(${cx*14}deg) rotateX(${-cy*14}deg)`;
  });
  document.addEventListener('mouseleave',()=>{
    if(touch)return;
    card.style.transition='transform .6s ease';
    card.style.transform='perspective(900px) rotateY(0deg) rotateX(0deg)';
    setTimeout(()=>{card.style.transition='transform .12s ease-out';},620);
  });
</script>
